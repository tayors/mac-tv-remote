name: Test and build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test remote transport and device responses
        run: ./scripts/test.sh
      - name: Test standalone project generation
        run: python3 -B -m unittest discover -s tests -v
      - name: Build native macOS app
        if: runner.os == 'macOS'
        run: ./scripts/build.sh "$RUNNER_TEMP/Mac TV Remote.app"
      - name: Verify app bundle
        if: runner.os == 'macOS'
        run: |
          plutil -lint "$RUNNER_TEMP/Mac TV Remote.app/Contents/Info.plist"
          codesign --verify --strict "$RUNNER_TEMP/Mac TV Remote.app"
